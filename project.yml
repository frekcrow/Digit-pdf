name: TrollDocs
options:
  bundleIdPrefix: com.trolldocs
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

targets:
  TrollDocs:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
          - "*.entitlements"
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/TrollDocs.entitlements
    settings:
      base:
        PRODUCT_NAME: TrollDocs
        PRODUCT_BUNDLE_IDENTIFIER: com.trolldocs.app
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_ENTITLEMENTS: Resources/TrollDocs.entitlements
